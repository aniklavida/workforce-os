name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plugin manifests are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok  $f"
          done

      - name: Skills and agents have frontmatter with name and description
        run: |
          fail=0
          for f in skills/*/SKILL.md agents/*.md agents/specialists/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "no frontmatter: $f"; fail=1; continue; }
            grep -qm1 '^name:'        "$f" || { echo "missing name: $f";        fail=1; }
            grep -qm1 '^description:' "$f" || { echo "missing description: $f"; fail=1; }
            echo "ok  $f"
          done
          exit $fail

      - name: Commands have a description
        run: |
          fail=0
          for f in commands/*.md; do
            grep -qm1 '^description:' "$f" || { echo "missing description: $f"; fail=1; continue; }
            echo "ok  $f"
          done
          exit $fail

      - name: Plugin version agrees with the CHANGELOG
        run: |
          v=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          c=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          echo "plugin.json=$v  newest released version in CHANGELOG=${c:-<none>}"
          if [ -z "$c" ]; then
            # Nothing has been released yet. The manifest must say so rather
            # than name a version a user could not have installed.
            [ "$v" = "0.0.0" ] || {
              echo "::error::CHANGELOG records no released version, so plugin.json must be 0.0.0, not $v"
              exit 1
            }
          else
            [ "$v" = "$c" ] || { echo "::error::version mismatch"; exit 1; }
          fi

      - name: No secrets committed
        run: |
          if git grep -nEI '(secret_[A-Za-z0-9]{20,}|nt[n]_[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,})' -- . ; then
            echo "::error::possible credential committed"; exit 1
          fi
          echo "clean"

      - name: Run acceptance test suite
        run: |
          python3 scripts/workforce_acceptance.py

      - name: Run install-by-prompt parity proof
        run: |
          python3 scripts/workforce_install_parity.py

      - name: Run Home view and degraded states self-test
        run: |
          python3 scripts/workforce_home.py --self-test

      - name: Run Specialist library and end-to-end task execution self-test
        run: |
          python3 scripts/workforce_specialist.py --self-test

